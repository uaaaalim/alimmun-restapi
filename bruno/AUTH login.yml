info:
  name: AUTH login
  type: http
  seq: 1

http:
  method: POST
  url: localhost:8080/auth/login
  headers:
    - name: X-Real-IP
      value: 192.168.1.1
    - name: User-Agent
      value: Dalvik/2.1.0 (Linux; U; Android 9; Redmi 6 Pro MIUI/9.6.27)
  body:
    type: json
    data: |-
      {
        "email": "{{authEmail}}",
        "password": "{{authPassword}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
