info:
  name: AUTH register
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/auth/register"
  headers:
    - name: X-Real-IP
      value: 192.168.0.1
  body:
    type: json
    data: |-
      {
        "email": "{{authEmail}}",
        "name": "alim",
        "password": "{{authPassword}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
